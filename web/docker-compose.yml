version: '3.8'
services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartq_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./SQL_Database_smartq.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  db_data:
